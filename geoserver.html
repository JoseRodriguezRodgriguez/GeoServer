<!DOCTYPE html>
<html>
<meta charset="utf-8" />
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>
  <style>
    #map {
      width: 100%;
      height: 600px;
      box-shadow: 5px 5px 5px #888;
    }
    .info {
      padding: 6px 8px;
      font: 14px/16px Arial, Helvetica, sans-serif;
      background: white;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
    }
    .info h2 {
      margin: 0 0 5px;
      color: #777;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    });

    // ── URL base con el workspace correcto ────────────────────────
    var wmsUrl = "http://localhost:8080/geoserver/guia_webmapping/wms";

    // ── Capa: Cerros ──────────────────────────────────────────────
    var cerros = L.tileLayer.wms(wmsUrl, {
      layers: 'guia_webmapping:cerros',
      format: 'image/png',
      transparent: true,
      version: '1.1.0',
      srs: 'EPSG:4326',
      attribution: "Centro Nacional de Registros"
    });

    // ── Capa: Ríos ────────────────────────────────────────────────
    var rios = L.tileLayer.wms(wmsUrl, {
      layers: 'guia_webmapping:rios',
      format: 'image/png',
      transparent: true,
      version: '1.1.0',
      srs: 'EPSG:4326',
      attribution: "Centro Nacional de Registros"
    });

    // ── Capa: Distritos ───────────────────────────────────────────
    var distritos = L.tileLayer.wms(wmsUrl, {
      layers: 'guia_webmapping:distritos',
      format: 'image/png',
      transparent: true,
      version: '1.1.0',
      srs: 'EPSG:4326',
      attribution: "Centro Nacional de Registros"
    });

    var baseMaps = {
      "OpenStreetMap": osm
    };

    var overlayMaps = {
      "Cerros": cerros,
      "Ríos": rios,
      "Distritos": distritos
    };

    var map = L.map('map', {
      center: new L.LatLng(13.65, -89.17),
      zoom: 8,
      layers: [osm, cerros, rios, distritos]
    });

    // ── Título ────────────────────────────────────────────────────
    var title = L.control();
    title.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'info');
      div.innerHTML = '<h2>El Salvador</h2>Cerros · Ríos · Distritos';
      return div;
    };
    title.addTo(map);

    // ── Leyenda ───────────────────────────────────────────────────
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function (map) {
      var div = L.DomUtil.create('div', 'info legend');
      var legendUrl = "http://localhost:8080/geoserver/guia_webmapping/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&WIDTH=20&HEIGHT=20&LAYER=";
      div.innerHTML =
        '<b>Leyenda</b><br>' +
        '<img src="' + legendUrl + 'guia_webmapping:cerros"    alt="Cerros">    Cerros<br>' +
        '<img src="' + legendUrl + 'guia_webmapping:rios"      alt="Ríos">      Ríos<br>' +
        '<img src="' + legendUrl + 'guia_webmapping:distritos" alt="Distritos"> Distritos';
      return div;
    };
    legend.addTo(map);

    // ── Control de capas ──────────────────────────────────────────
    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
  </script>
</body>
</html>
